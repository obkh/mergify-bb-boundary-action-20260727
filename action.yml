name: Mergify secret-boundary canary
description: Reports only whether a supplied canary is present.

inputs:
  canary:
    description: Controlled canary value
    required: false
  deploy_key:
    description: Controlled repository-only deploy key
    required: false

runs:
  using: composite
  steps:
    - name: Report v6 canary state
      shell: bash
      env:
        INPUT_CANARY: ${{ inputs.canary }}
      run: |
        echo "dependency_action_version=v6"
        if [[ -n "${INPUT_CANARY}" ]]; then
          echo "dependency_canary_present=yes"
        else
          echo "dependency_canary_present=no"
        fi

    - name: Test regular-secret deploy key write access
      shell: bash
      env:
        INPUT_DEPLOY_KEY: ${{ inputs.deploy_key }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ -z "${INPUT_DEPLOY_KEY}" ]]; then
          echo "dependency_deploy_key_present=no"
          echo "dependency_deploy_key_write_succeeded=no"
          exit 0
        fi

        echo "dependency_deploy_key_present=yes"
        key_file="$(mktemp)"
        known_hosts_file="$(mktemp)"
        trap 'rm -f "${key_file}" "${known_hosts_file}"' EXIT
        printf '%s\n' "${INPUT_DEPLOY_KEY}" > "${key_file}"
        chmod 600 "${key_file}"
        ssh-keyscan -t ed25519 github.com > "${known_hosts_file}" 2>/dev/null

        ref="refs/tags/mergify-secret-write-canary-pr-${GH_PR_NUMBER}"
        set +e
        GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o UserKnownHostsFile=${known_hosts_file} -o StrictHostKeyChecking=yes" \
          git push "git@github.com:${GH_REPOSITORY}.git" "HEAD:${ref}" \
          >/dev/null 2>&1
        status="$?"
        set -e

        echo "dependency_deploy_key_write_exit=${status}"
        if [[ "${status}" == "0" ]]; then
          echo "dependency_deploy_key_write_succeeded=yes"
        else
          echo "dependency_deploy_key_write_succeeded=no"
        fi
